[project]
name = "terminus"
version = "0.1.0"
description = "Calm, keyboard-first terminal day planner and focus timer"
requires-python = ">=3.11"
dependencies = [
    "textual>=8.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[project.scripts]
terminus = "terminus.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["terminus"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
