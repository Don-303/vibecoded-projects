modules:
  - id: python-foundations
    title: "Python Foundations for Quant Work"
    lessons:
      - id: py-core
        title: "Python core: types, control flow, functions, comprehensions"
      - id: py-numpy
        title: "NumPy: arrays, vectorization, broadcasting"
      - id: py-pandas
        title: "Pandas: Series/DataFrame, indexing, time series"
      - id: py-viz
        title: "Visualization: matplotlib basics for price/return series"

  - id: math-foundations
    title: "Math Foundations for Quant Finance"
    lessons:
      - id: mth-linalg
        title: "Linear algebra: matrix ops, eigenvalues/eigenvectors, PCA"
      - id: mth-prob
        title: "Probability & stochastic processes: Brownian motion, Markov chains"
      - id: mth-calc
        title: "Stochastic calculus intuition: Ito's lemma (conceptual)"
      - id: mth-optim
        title: "Optimization: convex optimization and Lagrange multipliers"

  - id: stats-foundations
    title: "Statistics & Probability Foundations"
    lessons:
      - id: st-descriptive
        title: "Descriptive statistics and probability distributions"
      - id: st-hypothesis
        title: "Hypothesis testing and confidence intervals"
      - id: st-ols
        title: "Linear regression (OLS) from scratch and with statsmodels"
      - id: st-stationarity
        title: "Correlation vs causation; intro to stationarity"

  - id: ml-foundations
    title: "Machine Learning Foundations"
    lessons:
      - id: ml-traintest
        title: "Train/test split, cross-validation, overfitting"
      - id: ml-regression
        title: "Regularized regression: Ridge, Lasso, Elastic Net"
      - id: ml-classification
        title: "Classification: logistic regression, trees, random forest"
      - id: ml-eval
        title: "Model evaluation metrics (finance-relevant: not just accuracy)"
      - id: ml-deeplearning
        title: "Deep learning for sequences: RNNs/LSTMs and transformers"
      - id: ml-nlp
        title: "NLP for alternative data: sentiment from news and filings"

  - id: econometrics
    title: "Time Series & Econometrics"
    lessons:
      - id: ec-stationarity
        title: "Stationarity and the ADF test"
      - id: ec-arima
        title: "ARIMA / SARIMA modeling"
      - id: ec-cointegration
        title: "Cointegration and pairs trading"
      - id: ec-garch
        title: "Volatility modeling with GARCH"
      - id: ec-factor
        title: "Factor models (Fama-French style)"

  - id: financial-theory
    title: "Financial Theory"
    lessons:
      - id: fin-mpt
        title: "Modern Portfolio Theory and the efficient frontier"
      - id: fin-capm
        title: "CAPM and Arbitrage Pricing Theory"
      - id: fin-derivatives
        title: "Derivatives pricing: Black-Scholes, binomial trees, the Greeks"
      - id: fin-fixedincome
        title: "Fixed income: yield curves, duration and convexity"
      - id: fin-microstructure
        title: "Market microstructure: order books, liquidity, transaction costs"
      - id: fin-risk
        title: "Risk management: VaR, CVaR, stress testing, drawdown analysis"

  - id: ml-finance
    title: "ML Applied to Finance"
    lessons:
      - id: mf-features
        title: "Feature engineering from price and fundamental data"
      - id: mf-returns
        title: "Return prediction models and lookahead bias"
      - id: mf-walkforward
        title: "Walk-forward validation for time series"
      - id: mf-backtest
        title: "Backtesting fundamentals and pitfalls"

  - id: engineering-practices
    title: "Engineering Practices for Quant Work"
    lessons:
      - id: eng-sql
        title: "SQL and handling large panel/tick datasets efficiently"
      - id: eng-backtest-discipline
        title: "Backtesting discipline: survivorship bias, overfitting, realistic costs"
      - id: eng-reproducibility
        title: "Reproducibility, version control, and production deployment awareness"

  - id: capstone
    title: "Capstone Projects"
    lessons:
      - id: cap-momentum
        title: "Build a momentum signal model for an ETF universe"
      - id: cap-vol
        title: "Build a volatility forecaster"
      - id: cap-pairs
        title: "Build a cointegration-based pairs-trading screener"
      - id: cap-options
        title: "Build an option pricing/Greeks calculator with an implied vol surface"
      - id: cap-risk
        title: "Build a portfolio risk model (VaR/CVaR) across a multi-asset book"
